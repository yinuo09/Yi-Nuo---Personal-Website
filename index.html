<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>一诺 — 个人成长 · 终身学习</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #15151f;
            --accent: #c9a362;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: '宋体', 'SimSun', 'Noto Serif SC', serif;
            background: var(--bg);
            color: #fff;
            height: 100%;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 340px;
            max-width: calc(100vw - 40px);
            background: var(--card-bg);
            border-radius: 28px;
            padding: 36px 28px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 70px rgba(201,163,98,0.15), 0 0 0 1px rgba(201,163,98,0.15);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 3px solid rgba(201,163,98,0.3);
            margin-bottom: 20px;
            display: block;
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.92);
            margin-bottom: 6px;
            text-align: center;
        }

        .tagline {
            font-size: 13px;
            letter-spacing: 0.18em;
            color: rgba(255,255,255,0.45);
            margin-bottom: 16px;
            text-align: center;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(201,163,98,0.4);
            margin-bottom: 16px;
        }

        .socials {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 18px;
            width: 100%;
        }
        .socials a {
            font-size: 12px;
            color: rgba(255,255,255,0.38);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
            white-space: nowrap;
        }
        .socials a:hover {
            color: rgba(201,163,98,0.85);
        }

        @media (max-width: 380px) {
            .card {
                width: 100%;
                padding: 30px 22px 24px;
                border-radius: 24px;
            }
            .avatar {
                width: 110px;
                height: 110px;
            }
            .name { font-size: 20px; }
            .tagline { font-size: 12px; }
            .socials { gap: 12px; }
            .socials a { font-size: 11px; }
        }

        @media (min-height: 700px) {
            body { padding: 40px; }
        }
    </style>
</head>
<body>
    <div class="card" onclick="window.location.href='resources/orbit.html'">
        <img src="assets/avatar.jpg?v=3" alt="一诺" class="avatar">
        <div class="name">一 诺</div>
        <div class="tagline">个人成长 · 终身学习</div>
        <div class="divider"></div>
        <div class="socials">
            <a href="https://v.douyin.com/xl69-nGOSIg/" target="_blank" rel="noopener" onclick="event.stopPropagation()">抖音</a>
            <a href="https://xhslink.com/m/8bl6a3J4i6K" target="_blank" rel="noopener" onclick="event.stopPropagation()">小红书</a>
            <a href="#" onclick="event.preventDefault();event.stopPropagation();alert('公众号：一诺的进阶笔记\n\n在微信搜索关注即可')">公众号</a>
            <a href="https://www.toutiao.com" target="_blank" rel="noopener" onclick="event.stopPropagation()">今日头条</a>
        </div>
    </div>
</body>
</html>
