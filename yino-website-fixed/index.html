        }
        .social-link {

            padding: 8px 16px; border-radius: 100px;
            background: var(--card-bg); border: 1px solid var(--border);
            text-decoration: none; color: var(--text);
            font-size: 13px; font-weight: 500;
            transition: all 0.2s ease; box-shadow: var(--shadow);
        }
        .social-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-color: var(--accent-light);
        }
        .social-link svg { width: 16px; height: 16px; opacity: 0.7; }
        
        .section { padding: 48px 0; }
        .section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px; font-weight: 600;
            margin-bottom: 24px; text-align: center;
        }

        .card {
            display: flex; align-items: center; gap: 20px;
            padding: 24px; background: var(--card-bg);
            border-radius: 16px; border: 1px solid var(--border);
            text-decoration: none; color: var(--text);
            transition: all 0.2s ease; box-shadow: var(--shadow);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-color: var(--accent-light);
        }
        .card-icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, #f5f2ed 0%, #ebe7e0 100%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .card-icon svg { width: 24px; height: 24px; color: var(--accent); }
        .card-content { flex: 1; min-width: 0; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; }
        .card-arrow {
            width: 20px; height: 20px; color: var(--text-tertiary);
            flex-shrink: 0; transition: transform 0.2s ease;
        }
        .card:hover .card-arrow { transform: translateX(4px); color: var(--accent); }
        
        .footer {
